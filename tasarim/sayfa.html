<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sıtkı Çoban</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Amiri&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f3ead7; --ink:#2b2118; --ink-soft:#5f4f3d; --head:#3a2a1a; --gold:#b08a3e; --line:#c9a96a; --logo-filter:none; }
  [data-theme="dark"] { --bg:#0f1420; --ink:#e9e3d3; --ink-soft:#b3ac9b; --head:#e8d39a; --gold:#c9a96a; --line:rgba(201,169,106,.35); --logo-filter:invert(1) sepia(.55) saturate(1.6) hue-rotate(-8deg) brightness(1.05); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Source Serif 4', serif; font-size:17px; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width:1180px; margin:0 auto; padding:0 28px; }
  header { border-bottom:1px solid var(--line); }
  header .wrap { display:flex; align-items:center; justify-content:space-between; height:72px; }
  .logo { display:flex; align-items:center; gap:14px; }
  .logo img { height:48px; filter:var(--logo-filter); }
  .logo .name { font-family:'Playfair Display', serif; font-size:22px; color:var(--head); padding-left:14px; border-left:1px solid var(--line); line-height:1; }
  nav a { margin-left:26px; position:relative; padding:4px 0; transition:color .3s; } nav a.on, nav a:hover { color:var(--gold); }
  nav a::after { content:''; position:absolute; left:0; right:0; bottom:-2px; height:1px; background:var(--gold); transform:scaleX(0); transform-origin:right; transition:transform .45s ease; }
  nav a:hover::after, nav a.on::after { transform:scaleX(1); }
  .lang { position:relative; margin-left:30px; }
  .lang-btn { width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; cursor:pointer; background:none; color:var(--head); padding:0; font:600 12px/1 'Source Serif 4', serif; letter-spacing:.06em; }
  .lang-btn:hover, .lang-btn[aria-expanded="true"] { color:var(--gold); border-color:var(--gold); }
  .lang-menu { position:absolute; top:calc(100% + 10px); right:0; min-width:150px; margin:0; padding:6px 0; list-style:none; background:var(--bg); border:1px solid var(--line); box-shadow:0 12px 30px rgba(0,0,0,.15); opacity:0; visibility:hidden; transform:translateY(-4px); transition:.2s; z-index:30; }
  .lang.open .lang-menu { opacity:1; visibility:visible; transform:none; }
  .lang-menu a { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:8px 16px; font-size:15px; }
  .lang-menu a:hover, .lang-menu a[aria-current="true"] { color:var(--gold); }
  .lang-menu .code { font-size:11px; letter-spacing:.1em; color:var(--ink-soft); }
  .lang-menu .ar { font-family:'Amiri', serif; font-size:17px; }
  .theme { margin-left:14px; width:38px; height:38px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; cursor:pointer; background:none; color:var(--head); padding:0; }
  .theme svg { width:18px; height:18px; }
  .theme .sun { display:none; } [data-theme="dark"] .theme .sun { display:block; } [data-theme="dark"] .theme .moon { display:none; }
  main { min-height:70vh; display:grid; place-items:center; text-align:center; padding:60px 20px; }
  .eyebrow { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:var(--gold); }
  h1 { font-family:'Playfair Display', serif; font-weight:400; font-size:56px; color:var(--head); margin:8px 0 14px; }
  p { color:var(--ink-soft); font-style:italic; }
  .orn { color:var(--gold); letter-spacing:.7em; }
  .menu-btn { display:none; margin-left:10px; width:38px; height:38px; place-items:center; border:1px solid var(--line); border-radius:50%; cursor:pointer; background:none; color:var(--head); padding:0; }
  .menu-btn svg { width:18px; height:18px; }
  .mnav { position:fixed; inset:0; z-index:50; background:var(--bg); display:flex; flex-direction:column; opacity:0; visibility:hidden; transition:opacity .3s, visibility .3s; }
  .mnav.open { opacity:1; visibility:visible; }
  .mnav .top { display:flex; align-items:center; justify-content:space-between; height:72px; padding:0 20px; border-bottom:1px solid var(--line); }
  .mnav .links { flex:1; display:flex; flex-direction:column; justify-content:center; padding:0 32px; }
  .mnav .links a { margin:0; font-family:'Playfair Display', serif; font-size:32px; color:var(--head); padding:10px 0; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:baseline; }
  .mnav .links a::after { content:'←'; position:static; transform:none; background:none; height:auto; font-family:'Source Serif 4', serif; font-size:18px; color:var(--gold); }
  .mnav .links a.on { color:var(--gold); }
  @media (max-width:860px){
    header nav { display:none; }
    .menu-btn { display:grid; }
    .logo .name { white-space:nowrap; font-size:19px; } .logo img { height:40px; }
    .lang { margin-left:12px; } .theme { margin-left:10px; }
  }
</style>
</head>
<body>
<header><div class="wrap">
  <a class="logo" href="index.html"><img src="img/imza.png" alt=""><span class="name">Sıtkı Çoban</span></a>
  <div style="display:flex;align-items:center">
    <nav id="nav"></nav>
    <div class="lang" id="lang">
      <button class="lang-btn" id="lbtn" aria-haspopup="true" aria-expanded="false" aria-label="Dil seçin (şu an Türkçe)">TR</button>
      <ul class="lang-menu" role="menu">
        <li><a href="#" role="menuitem" aria-current="true">Türkçe <span class="code">TR</span></a></li>
        <li><a href="#" role="menuitem">English <span class="code">EN</span></a></li>
        <li><a href="#" role="menuitem"><span class="ar">العربية</span> <span class="code">AR</span></a></li>
      </ul>
    </div>
    <button class="theme" id="tbtn" onclick="toggleTheme()" aria-label="Gece görünümüne geç">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    </button>
    <button class="menu-btn" id="mbtn" aria-label="Menüyü aç" aria-expanded="false" aria-controls="mnav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M8 17h12"/></svg>
    </button>
  </div>
</div></header>
<div class="mnav" id="mnav" role="dialog" aria-modal="true" aria-label="Menü">
  <div class="top">
    <a class="logo" href="index.html"><img src="img/imza.png" alt=""><span class="name">Sıtkı Çoban</span></a>
    <button class="menu-btn" id="mclose" aria-label="Menüyü kapat" style="display:grid">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="links" id="mlinks" role="navigation"></div>
</div>
<main><div>
  <div class="orn">❖</div>
  <div class="eyebrow">Ayrı sayfa</div>
  <h1 id="title"></h1>
  <p>Bu sayfanın tasarımı sıradaki adımda yapılacak.</p>
  <p style="font-style:normal;margin-top:24px"><a href="index.html" style="border-bottom:1px solid var(--line)">← Ana sayfaya dön</a></p>
</div></main>
<script>
  const pages = { eserler:'Eserler', yazilar:'Yazılar', kitaplar:'Kitaplar', videolar:'Videolar', hayati:'Hayatı', iletisim:'İletişim' };
  const p = new URLSearchParams(location.search).get('p') || 'eserler';
  document.getElementById('title').textContent = pages[p] || '';
  document.title = (pages[p] || '') + ' · Sıtkı Çoban';
  document.getElementById('nav').innerHTML = Object.entries(pages).map(([k,v]) => `<a href="${({eserler:"eserler.html", yazilar:"yazilar.html", kitaplar:"kitaplar.html"})[k] || "sayfa.html?p=" + k}" class="${k===p?'on':''}">${v}</a>`).join('');
  document.getElementById('mlinks').innerHTML = document.getElementById('nav').innerHTML;
  const mnav = document.getElementById('mnav'), mbtn = document.getElementById('mbtn');
  function setMenu(o){ mnav.classList.toggle('open', o); mbtn.setAttribute('aria-expanded', o); document.body.style.overflow = o ? 'hidden' : ''; }
  mbtn.addEventListener('click', () => setMenu(true));
  document.getElementById('mclose').addEventListener('click', () => setMenu(false));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
  const lang = document.getElementById('lang'), lbtn = document.getElementById('lbtn');
  function setLangOpen(o){ lang.classList.toggle('open', o); lbtn.setAttribute('aria-expanded', o); }
  lbtn.addEventListener('click', e => { e.stopPropagation(); setLangOpen(!lang.classList.contains('open')); });
  document.addEventListener('click', e => { if (!lang.contains(e.target)) setLangOpen(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setLangOpen(false); });
  function setTheme(t){ document.documentElement.dataset.theme=t; document.getElementById('tbtn').setAttribute('aria-label', t==='dark'?'Gündüz görünümüne geç':'Gece görünümüne geç'); try{localStorage.setItem('tema',t);}catch(e){} }
  function toggleTheme(){ setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'); }
  try { const t=localStorage.getItem('tema'); if (t) setTheme(t); } catch(e) {}
</script>
</body>
</html>
