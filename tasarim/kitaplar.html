<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitaplar · Sıtkı Çoban</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Amiri&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ortak.css">
<link rel="stylesheet" href="kitap-lb.css">
<style>
  .cats { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:6px 0 50px; }
  .chip { white-space:nowrap; border:1px solid var(--line-strong); border-radius:20px; padding:3px 16px; font:inherit; font-size:15px; background:none; color:var(--ink); cursor:pointer; transition:.2s; }
  .chip:hover { border-color:var(--gold); color:var(--gold); }
  .chip.on { background:var(--head); border-color:var(--head); color:var(--bg); }

  /* Raf: kapaklar üstten hizalı, başlık iki satır yer kaplar */
  .shelf { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:54px 36px; margin-bottom:110px; align-items:start; }
  .book { display:block; cursor:pointer; background:none; border:0; padding:0; text-align:left; font:inherit; color:inherit; }
  .book.hide { display:none; }
  .cover { aspect-ratio:2/3; background:var(--paper); outline:1px solid var(--line); box-shadow:0 12px 26px rgba(40,25,10,.18), var(--shadow); transition:transform .35s ease, box-shadow .35s ease; overflow:hidden; display:grid; place-items:center; }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover img.contain { object-fit:contain; padding:8px; }
  .book:hover .cover { transform:translateY(-8px); box-shadow:0 22px 38px rgba(40,25,10,.26), var(--shadow); }
  .book h3 { font-size:19px; line-height:1.3; margin:16px 0 4px; min-height:calc(2 * 1.3em); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; transition:color .2s; }
  .book:hover h3 { color:var(--gold); }
  .book .role { font-size:14px; color:var(--ink-soft); }
  .book .role b { font-weight:500; color:var(--gold); }

  .note { text-align:center; color:var(--ink-soft); font-size:14px; font-style:italic; margin:-70px 0 90px; }

  @media (max-width: 860px) {
    .shelf { grid-template-columns:repeat(2, 1fr); gap:36px 18px; }
    .book h3 { font-size:16px; }
  }
</style>
</head>
<body data-page="Kitaplar">

<div class="page-head wrap">
  <div class="orn">❖</div>
  <h1>Kitaplar</h1>
  <p>Klasik şiirimizden derlemeler, tasavvuf klasiklerinin sadeleştirmeleri ve çocuklar için hikmetli hikâyeler.</p>
</div>

<main class="wrap">
  <div class="cats" id="cats"></div>
  <div class="shelf" id="shelf"></div>
  <p class="note">Kitapların rolleri, yayınevleri, yılları ve tanıtım metinleri taslak için yazılmış örneklerdir; teyit edilmesi gerekir.</p>
</main>

<script src="ortak.js"></script>
<script src="kitap-lb.js"></script>
<script>
  const books = window.KITAPLAR, esc = kitapEsc, coverHtml = kitapKapak;
  const shelf = document.getElementById('shelf');
  shelf.innerHTML = books.map((b, i) => `
    <button class="book" data-i="${i}" data-role="${b.role}">
      <div class="cover">${coverHtml(b)}</div>
      <h3>${esc(b.t)}</h3>
      <div class="role"><b>${b.role}</b>${b.a ? ' · ' + esc(b.a) : ''}</div>
    </button>`).join('');

  // Rol çipleri: Yazar, Hazırlayan, Sadeleştiren, Derleyen
  const cats = document.getElementById('cats');
  ['Tümü', ...new Set(books.map(b => b.role))].forEach(r => {
    const c = document.createElement('button'); c.className = 'chip' + (r === 'Tümü' ? ' on' : ''); c.textContent = r;
    c.onclick = () => {
      cats.querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c));
      shelf.querySelectorAll('.book').forEach(b => b.classList.toggle('hide', r !== 'Tümü' && b.dataset.role !== r));
    };
    cats.appendChild(c);
  });

  // Kitaba tıklanınca ayrıntı penceresi açılır; oklar seçili roldeki kitaplar arasında gezer
  shelf.addEventListener('click', e => { const b = e.target.closest('.book'); if (b) kitapAc([...shelf.querySelectorAll('.book:not(.hide)')].map(x => +x.dataset.i), +b.dataset.i); });
</script>
</body>
</html>
